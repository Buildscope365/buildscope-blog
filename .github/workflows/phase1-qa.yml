name: Website Phase 1 QA
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/phase1-qa.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:assets
      - name: Learning Worker smoke QA
        run: |
          npx wrangler d1 execute LEARNING_DB --config wrangler.learning-ci.jsonc --local --persist-to /tmp/buildscope-learning-ci --file migrations/0001_learning.sql
          node tests/learning-worker-seed.mjs
          npx wrangler d1 execute LEARNING_DB --config wrangler.learning-ci.jsonc --local --persist-to /tmp/buildscope-learning-ci --file /tmp/buildscope-learning-fixture.sql
          for i in $(seq 1 6); do npx wrangler r2 object put buildscope-learning-ci/dewatering/lesson-$i.webp --config wrangler.learning-ci.jsonc --local --persist-to /tmp/buildscope-learning-ci --file public/images/learning/dewatering/course-cover.webp; done
          npx wrangler dev --config wrangler.learning-ci.jsonc --local --persist-to /tmp/buildscope-learning-ci --ip 127.0.0.1 --port 8787 --var LEARNING_ADMIN_TOKEN:ci_admin_token > /tmp/buildscope-learning-worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/learn/lessons > /dev/null && break; sleep 1; done
          node tests/learning-worker-smoke.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/sitemap.xml > /dev/null && break; sleep 1; done
          npm run test:e2e
          node tests/sop-browser.mjs
          node tests/nec-browser.mjs
          node tests/learning-browser.mjs
          node tests/learning-reader-browser.mjs
        env:
          SCREENSHOT_DIR: /tmp/buildscope-phase1-screenshots
          LEARNING_WORKER_URL: http://127.0.0.1:8787
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-desktop-mobile-screenshots
          path: /tmp/buildscope-phase1-screenshots/
          if-no-files-found: warn

  deploy-learning-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/dewatering-course-pilot-009'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: buildscope-learning-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare isolated preview configuration
        env:
          LEARNING_TEST_D1_ID: ${{ secrets.LEARNING_TEST_D1_ID }}
          LEARNING_PREVIEW_ORIGIN: ${{ secrets.LEARNING_PREVIEW_ORIGIN }}
        run: node scripts/make-learning-preview-config.mjs
      - name: Deploy only the separate preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEARNING_TEST_D1_ID: ${{ secrets.LEARNING_TEST_D1_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare preview credentials are missing from GitHub Secrets.' >&2
            exit 1
          fi
          npx wrangler d1 info LEARNING_DB --json --config .wrangler.learning-preview.jsonc > /tmp/learning-preview-db.json
          node -e "const fs=require('fs'); const db=JSON.parse(fs.readFileSync('/tmp/learning-preview-db.json')); if (db.name!=='buildscope-learning-test' || db.uuid!==process.env.LEARNING_TEST_D1_ID) throw Error('Refusing to migrate a D1 database other than buildscope-learning-test')"
          npx wrangler d1 execute LEARNING_DB --remote --yes --config .wrangler.learning-preview.jsonc --file migrations/0001_learning.sql
          npx wrangler deploy --config .wrangler.learning-preview.jsonc
      - name: Verify locked preview routes
        env:
          LEARNING_PREVIEW_ORIGIN: ${{ secrets.LEARNING_PREVIEW_ORIGIN }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$LEARNING_PREVIEW_ORIGIN/api/learn/lessons" -o /tmp/learning-preview-lessons.json; then break; fi
            sleep 5
          done
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/learning-preview-lessons.json')); if (data.lessons?.length!==9 || data.access!==false) process.exit(1)"
          lesson_status=$(curl -sS -o /dev/null -w '%{http_code}' "$LEARNING_PREVIEW_ORIGIN/api/learn/lesson?id=basics")
          resource_status=$(curl -sS -o /dev/null -w '%{http_code}' "$LEARNING_PREVIEW_ORIGIN/api/learn/resource")
          test "$lesson_status" = 401 && test "$resource_status" = 401
