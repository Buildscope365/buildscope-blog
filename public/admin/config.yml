backend:
  name: github
  repo: Buildscope365/buildscope-blog
  branch: main
  base_url: "https://buildscope-blog.com"
  auth_endpoint: "/auth"
  site_domain: "buildscope-blog.com"

site_url: "https://buildscope-blog.com"
display_url: "https://buildscope-blog.com"
logo_url: "/images/buildscope-logo.webp"

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
show_preview_links: true

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "readers"
    label: "Visual Library"
    label_singular: "圖解 Topic"
    description: "管理工程圖解、Carousel 圖片次序及 Topic-specific Skool 連結。"
    folder: "src/content/readers"
    create: true
    delete: true
    extension: "md"
    format: "yaml-frontmatter"
    identifier_field: "slug"
    slug: "{{slug}}"
    preview_path: "read/{{slug}}/"
    summary: "{{publishedDate}} — {{title}}"
    sortable_fields: ["publishedDate", "title", "category", "draft"]
    editor:
      preview: false
    fields:
      - label: "網址 Slug"
        name: "slug"
        widget: "string"
        hint: "只用小寫英文字母、數字及連字號，例如 bored-pile。發布後不建議修改，否則舊連結會失效。"
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "只可使用小寫英文字母、數字及連字號。"]
      - { label: "Topic 標題", name: "title", widget: "string" }
      - label: "分類"
        name: "category"
        widget: "select"
        options:
          - { label: "地盤施工", value: "site-works" }
          - { label: "Contracts & QS", value: "contracts-qs" }
          - { label: "Building Services", value: "building-services" }
          - { label: "Site Management", value: "site-management" }
          - { label: "Design / Statutory", value: "design-statutory" }
          - { label: "Safety & Environment", value: "safety-environment" }
          - { label: "AI for Construction", value: "ai-construction" }
          - { label: "工程案例", value: "engineering-cases" }
      - { label: "分類副題", name: "categoryLine", widget: "string", hint: "例如 Landscape × QS 或 Foundation × Site Works。" }
      - { label: "搜尋 Tags", name: "tags", widget: "list", allow_add: true, collapsed: false, default: [] }
      - { label: "卡片簡介", name: "introduction", widget: "text", hint: "顯示在 Visual Library 卡片及 Reader 頁首。" }
      - { label: "讀圖重點", name: "quickTakeaway", widget: "text" }
      - { label: "發布日期", name: "publishedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "草稿（不公開）", name: "draft", widget: "boolean", default: true }
      - label: "Carousel 圖片"
        name: "slides"
        widget: "list"
        min: 1
        max: 20
        collapsed: true
        summary: "{{fields.label}}"
        hint: "第一張會成為 Library cover 及 Open Graph 圖片；可拖放調整次序。建議全部使用相同比例，例如 1080 × 1350。"
        fields:
          - { label: "圖片", name: "src", widget: "image" }
          - { label: "短標籤", name: "label", widget: "string", hint: "例如 封面、植物材料、總結。" }
          - { label: "圖片替代文字", name: "alt", widget: "string", hint: "簡短描述圖片重點，供 SEO 及無障礙閱讀使用。" }
      - { label: "討論問題", name: "discussionQuestion", widget: "text", hint: "顯示在 Skool Discussion 按鈕。" }
      - { label: "PRO Course 已上架", name: "isProCourseAvailable", widget: "boolean", default: false, hint: "只在已核實 Course URL 及課程確實可用時開啟。" }
      - { label: "Course 顯示名稱", name: "courseTitle", widget: "string", required: false, hint: "例如 HVAC Micro Course；沒有核實課程請留空。" }
      - { label: "Skool Micro Course 網址", name: "skoolCourseUrl", widget: "string", required: false, hint: "請貼 Topic-specific 完整 https:// 網址；未準備好請留空。" }
      - { label: "Resource 顯示名稱", name: "resourceTitle", widget: "string", required: false, hint: "只寫已核實名稱；不要自行新增檔案名稱。" }
      - { label: "Resource 簡介", name: "resourcePreview", widget: "text", required: false, hint: "簡短說明可在 Skool 查看甚麼；實際內容以 Classroom 為準。" }
      - { label: "Skool Resources 網址", name: "skoolResourceUrl", widget: "string", required: false, hint: "請貼 Topic-specific 完整 https:// 網址；未準備好請留空。" }
      - { label: "Skool Discussion 網址", name: "skoolDiscussionUrl", widget: "string", required: false, hint: "請貼 Topic-specific 討論帖網址；未準備好請留空。" }

  - name: "blog"
    label: "工程 Blog"
    label_singular: "文章"
    folder: "src/content/blog"
    create: true
    delete: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title", "author", "category"]
    editor:
      preview: false
    fields:
      - { label: "文章標題", name: "title", widget: "string" }
      - { label: "SEO／列表簡介", name: "description", widget: "text", hint: "建議 60–150 字，會顯示在首頁、文章列表及搜尋結果。" }
      - { label: "發布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - label: "分類"
        name: "category"
        widget: "select"
        options:
          - { label: "QS 白話文", value: "quantity-surveying" }
          - { label: "合約管理", value: "contract-management" }
          - { label: "NEC 合約", value: "nec" }
          - { label: "SOP Ordinance", value: "sop" }
          - { label: "RFI / TQ", value: "rfi-tq" }
          - { label: "EOT / LAD", value: "eot-lad" }
          - { label: "VO / Payment Claim", value: "vo-payment" }
          - { label: "施工管理", value: "site-management" }
          - { label: "工程技術", value: "construction-technology" }
          - { label: "AI × 工程", value: "ai-tools" }
          - { label: "工程案例", value: "case-studies" }
          - { label: "工程管理", value: "project-management" }
          - { label: "Tender", value: "tender" }
      - { label: "標籤", name: "tags", widget: "list", required: false, allow_add: true, collapsed: false }
      - { label: "封面圖片", name: "coverImage", widget: "image", required: false }
      - { label: "作者", name: "author", widget: "string", default: "BuildScope 編輯部" }
      - { label: "作者類型", name: "authorType", widget: "select", default: "Organization", options: ["Organization", "Person"], hint: "真人作者選 Person；編輯部／機構選 Organization。" }
      - { label: "難度", name: "difficulty", widget: "select", default: "入門", options: ["入門", "中階", "進階"] }
      - { label: "閱讀時間", name: "readingTime", widget: "string", default: "5 分鐘" }
      - { label: "最後覆核日期", name: "lastReviewedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "只有實際覆核內容後才填寫；不要自動改為今日。" }
      - { label: "內容更新日期", name: "updatedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "只有內容實際修改後才填；此日期用於 Article dateModified 與 Sitemap lastmod。" }
      - label: "參考來源"
        name: "sources"
        widget: "list"
        required: false
        fields:
          - { label: "來源名稱", name: "name", widget: "string" }
          - { label: "完整 https 網址", name: "url", widget: "string" }
      - { label: "相關圖解 Slug", name: "relatedReaders", widget: "list", required: false, hint: "例如 programme-contractual-status；只連結已發布的圖解。" }
      - { label: "相關文章 Slug", name: "relatedArticles", widget: "list", required: false, hint: "只連結已發布文章的檔案名稱，不含 .md。" }
      - { label: "首頁精選", name: "featured", widget: "boolean", default: false }
      - { label: "草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "文章內容", name: "body", widget: "markdown" }

  - name: "news"
    label: "工程新聞"
    label_singular: "新聞"
    folder: "src/content/news"
    create: true
    delete: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    preview_path: "news/{{slug}}/"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title", "category"]
    editor:
      preview: false
    fields:
      - { label: "新聞標題", name: "title", widget: "string" }
      - { label: "摘要", name: "summary", widget: "text" }
      - { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "分類", name: "category", widget: "select", options: ["香港建築新聞", "政策及法例", "建築科技與 AI", "安全消息", "大型工程"] }
      - { label: "來源名稱", name: "sourceName", widget: "string", required: false }
      - { label: "來源網址", name: "sourceUrl", widget: "string", required: false }
      - { label: "封面圖片", name: "coverImage", widget: "image", required: false }
      - { label: "首頁精選", name: "featured", widget: "boolean", default: false }
      - { label: "草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "新聞內容／編輯摘要", name: "body", widget: "markdown" }

  - name: "templates"
    label: "文件範本"
    label_singular: "範本"
    folder: "src/content/templates"
    create: true
    delete: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    summary: "{{sortOrder}} — {{title}} — {{access}}"
    sortable_fields: ["sortOrder", "title", "category", "access"]
    editor:
      preview: false
    fields:
      - { label: "範本名稱", name: "title", widget: "string" }
      - { label: "簡介", name: "description", widget: "text" }
      - { label: "分類", name: "category", widget: "string" }
      - { label: "檔案格式", name: "fileType", widget: "select", options: ["DOCX", "XLSX", "PDF", "ZIP", "ONLINE"] }
      - { label: "發布狀態", name: "access", widget: "select", default: "即將推出", options: ["免費", "付費", "會員專享", "即將推出"] }
      - { label: "按鈕文字", name: "actionLabel", widget: "string", default: "預覽範本" }
      - { label: "下載／購買網址", name: "downloadUrl", widget: "string", required: false, hint: "可填網站內路徑或完整 https:// 網址；留空時按鈕不會啟用。" }
      - { label: "首頁精選", name: "featured", widget: "boolean", default: false }
      - { label: "草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "排列次序", name: "sortOrder", widget: "number", value_type: "int", default: 100, min: 1 }
      - { label: "補充說明", name: "body", widget: "markdown", required: false }

  - name: "ebooks"
    label: "電子書"
    label_singular: "電子書"
    folder: "src/content/ebooks"
    create: true
    delete: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    summary: "{{sortOrder}} — {{title}} — {{status}}"
    sortable_fields: ["sortOrder", "title", "status"]
    editor:
      preview: false
    fields:
      - { label: "書名", name: "title", widget: "string" }
      - { label: "副標題", name: "subtitle", widget: "string" }
      - { label: "簡介", name: "description", widget: "text" }
      - { label: "頁數", name: "pages", widget: "string", default: "100 頁" }
      - { label: "狀態", name: "status", widget: "select", default: "編輯中", options: ["現已發售", "即將推出", "編輯中", "免費下載"] }
      - { label: "格式", name: "format", widget: "string", default: "PDF" }
      - { label: "語言", name: "language", widget: "string", default: "繁體中文" }
      - { label: "封面圖片", name: "coverImage", widget: "image", required: false }
      - { label: "購買／下載網址", name: "purchaseUrl", widget: "string", required: false }
      - { label: "按鈕文字", name: "actionLabel", widget: "string", default: "查看詳情" }
      - { label: "首頁精選", name: "featured", widget: "boolean", default: false }
      - { label: "草稿（不公開）", name: "draft", widget: "boolean", default: false }
      - { label: "排列次序", name: "sortOrder", widget: "number", value_type: "int", default: 100, min: 1 }
      - { label: "詳細內容", name: "body", widget: "markdown", required: false }
